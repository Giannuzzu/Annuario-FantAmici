<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annuario FantAmici · Archivio Storico</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1f2740; --line:#2b3450;
  --txt:#e8ecf5; --muted:#93a0bd; --gold:#e9b949; --gold2:#f6d372;
  --accent:#4f8cff; --green:#37c98a; --red:#e56a6a;
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0d1220,#0f1420 240px);color:var(--txt);}
a{color:var(--accent)}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:22px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:radial-gradient(circle at 30% 25%,var(--gold2),var(--gold));display:grid;place-items:center;font-weight:800;color:#2a2205;font-size:20px;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0;letter-spacing:.3px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit}
.sel{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:150px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a2205;border:none;font-weight:700}
.btn.ghost{background:transparent}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px;border-bottom:1px solid var(--line)}
.tab{padding:11px 16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:600;font-size:14.5px}
.tab.active{color:var(--txt);border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .v.small{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.r,th.r{text-align:right}
tr:hover td{background:rgba(255,255,255,.02)}
.pos{width:30px;height:26px;display:inline-grid;place-items:center;border-radius:7px;background:var(--panel2);font-weight:700;font-size:13px}
.pos.p1{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a2205}
.pos.p2{background:#c8d2e8;color:#1b2135}
.pos.p3{background:#d9a06b;color:#2a1a08}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.badge.gold{background:rgba(233,185,73,.16);color:var(--gold2);border:1px solid rgba(233,185,73,.35)}
.badge.win{background:rgba(55,201,138,.15);color:var(--green)}
.chartbox{position:relative;height:420px}
.playbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.playbar input[type=range]{flex:1;min-width:160px;accent-color:var(--gold)}
.mini-standings{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px}
.mini-standings .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.mini-standings .row:last-child{border:none}
.roster{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.roster h3{margin:0 0 2px;font-size:15px}
.roster .team{color:var(--gold2);font-size:12.5px;margin-bottom:8px}
.rolehdr{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 3px}
.pl{display:flex;justify-content:space-between;padding:2px 0;font-size:13.5px}
.pl .pr{color:var(--gold2);font-weight:700}
.foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(6,9,16,.72);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:18px}
.overlay.show{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--shadow);overflow:hidden}
.modal .hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .bd{padding:20px}
.modal .ft{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--panel2)}
.drop label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.drop input{width:100%;color:var(--txt);font-size:13px}
.filename{color:var(--green);font-size:12.5px;margin-top:6px;min-height:16px}
.preview{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;white-space:pre-wrap;line-height:1.6;max-height:230px;overflow:auto}
.ok{color:var(--green)} .warn{color:var(--gold2)} .err{color:var(--red)}
.h2h-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.close{cursor:pointer;color:var(--muted);font-size:20px}
.hint{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.bracket{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.bx{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.bx.win{border-color:var(--gold);box-shadow:0 0 0 1px rgba(233,185,73,.25) inset}
.trophy{font-size:34px;text-align:center}
.tag{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">Fⓐ</div>
      <div>
        <h1>Annuario FantAmici</h1>
        <p>Archivio storico · classifiche, coppa e rose stagione per stagione</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <select id="seasonSelect" class="sel" title="Seleziona stagione"></select>
      <button class="btn primary" id="btnImport">⬆ Importa stagione</button>
      <button class="btn ghost" id="btnExport" title="Esporta la stagione selezionata in JSON">⬇ Esporta</button>
      <button class="btn ghost" id="btnManage" title="Gestisci archivio locale">⚙</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-t="riepilogo">🏆 Riepilogo</div>
    <div class="tab" data-t="campionato">📈 Campionato</div>
    <div class="tab" data-t="coppa">🏅 Coppa</div>
    <div class="tab" data-t="rose">👥 Rose</div>
  </div>

  <div id="view"></div>
  <p class="hint" style="text-align:center;margin-top:26px">
    FantAmici Community · anno XXI · i dati vengono letti dai file Excel di stagione. Nessun dato lascia il tuo browser.
  </p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="hd"><strong>Importa stagione</strong><span class="close" id="mClose">✕</span></div>
    <div class="bd">
      <div class="drop">
        <label>1) File classifiche e calendario &nbsp;<span class="hint">(es. F2526_Classifiche e calendario.xlsm)</span></label>
        <input type="file" id="fileClass" accept=".xlsx,.xlsm">
        <div class="filename" id="nameClass"></div>
      </div>
      <div class="drop">
        <label>2) File rose / asta &nbsp;<span class="hint">(es. F2526_Squadre_rev....xlsx)</span></label>
        <input type="file" id="fileRose" accept=".xlsx,.xlsm">
        <div class="filename" id="nameRose"></div>
      </div>
      <button class="btn" id="btnAnalyze" style="width:100%;justify-content:center">🔍 Analizza file</button>
      <div id="previewWrap" style="margin-top:12px;display:none">
        <div class="hint" style="margin-bottom:6px">Anteprima importazione</div>
        <div class="preview" id="preview"></div>
      </div>
    </div>
    <div class="ft">
      <button class="btn ghost" id="mCancel">Annulla</button>
      <button class="btn primary" id="mConfirm" disabled>✓ Conferma importazione</button>
    </div>
  </div>
</div>

/* ---------- PARSER ---------- */
function sheetToGrid(ws){ const ref=XLSX.utils.decode_range(ws['!ref']);
  return {maxR:ref.e.r+1,maxC:ref.e.c+1,get(r,c){const cell=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];return cell?cell.v:null;}}; }
const findChampSheet=wb=>wb.SheetNames.find(s=>/classifica campionato/i.test(s))||wb.SheetNames.find(s=>/classifica/i.test(s)&&!/coppa/i.test(s))||wb.SheetNames.find(s=>/classifica/i.test(s))||wb.SheetNames[0];
const findCupSheet=wb=>wb.SheetNames.find(s=>/classifica coppa/i.test(s));
const findCalendarSheet=wb=>wb.SheetNames.find(s=>/calendario/i.test(s));
const findAstaSheet=wb=>wb.SheetNames.find(s=>/asta/i.test(s))||wb.SheetNames[0];
const parseScore=s=>{ s=norm(s); if(!s)return[null,null]; const m=String(s).match(/(\d+)\s*-\s*(\d+)/); return m?[+m[1],+m[2]]:[null,null]; };

function parseCupMatches(wb){
  const name=findCalendarSheet(wb); if(!name) return [];
  const g=sheetToGrid(wb.Sheets[name]);
  // detect text/two-legged format (Format B) by a '-' separator cell in the top rows
  let isB=false;
  for(let r=1;r<=Math.min(g.maxR,8)&&!isB;r++) for(let c=1;c<=g.maxC;c++){ if(norm(g.get(r,c))==='-'){isB=true;break;} }
  const out=[];
    // Formato C: sfida unita in una cella "CASA-OSPITE" + 2 celle punteggio (andata/ritorno)
  let isC=false;
  for(let r=1;r<=Math.min(g.maxR,12)&&!isC;r++) for(let c=1;c<=g.maxC;c++){ const v=norm(g.get(r,c));
    if(v&&/[A-Za-z].*-.*[A-Za-z]/.test(v)&&!/^\s*\d/.test(v)&&v.split('-').length>=2){ const sc=parseScore(g.get(r,c+1)); if(sc[0]!=null){isC=true;break;} } }
  if(isC){
    for(let r=1;r<=g.maxR;r++) for(let c=1;c<=g.maxC;c++){ const v=norm(g.get(r,c));
      if(!v||!v.includes('-')||/^\s*\d/.test(v)) continue;
      const parts=v.split('-'); if(parts.length<2) continue;
      const away=parts.pop().trim(); const home=parts.join('-').trim();
      if(!(/[A-Za-z]/.test(home)&&/[A-Za-z]/.test(away))) continue;
      const [a1,a2]=parseScore(g.get(r,c+1)); const [r1,r2]=parseScore(g.get(r,c+2));
      if(a1==null&&r1==null) continue;
      if(a1!=null) out.push({md:null,home,homeCanon:canon(home),away,awayCanon:canon(away),gh:a1,ga:a2});
      if(r1!=null) out.push({md:null,home:away,homeCanon:canon(away),away:home,awayCanon:canon(home),gh:r2,ga:r1});
    }
    return out;
  }
  if(isB){
    const mdLabel=(r,c)=>{ for(let rr=r;rr>=1;rr--){ const v=norm(g.get(rr,c-2)); if(v&&/^\d+\s*-\s*\d+/.test(v)){ const m=v.match(/\d+/g); return [+m[0],+m[1]]; } } return [null,null]; };
    for(let r=1;r<=g.maxR;r++) for(let c=1;c<=g.maxC;c++){
      if(norm(g.get(r,c))!=='-') continue;
      const home=norm(g.get(r,c-1)), away=norm(g.get(r,c+1)); if(!home||!away) continue;
      const [md1,md2]=mdLabel(r,c);
      const [a1,a2]=parseScore(g.get(r,c+2)); // andata: home a1 - away a2
      const [r1,r2]=parseScore(g.get(r,c+3)); // ritorno: venue reversed, written left-right → home(new=away) gets r2
      if(a1!=null) out.push({md:md1,home,homeCanon:canon(home),away,awayCanon:canon(away),gh:a1,ga:a2});
      if(r1!=null) out.push({md:md2,home:away,homeCanon:canon(away),away:home,awayCanon:canon(home),gh:r2,ga:r1});
    }
  } else {
    let md=null;
    for(let r=2;r<=g.maxR;r++){ const m=g.get(r,1); if(typeof m==='number')md=Math.round(m);
      const h=norm(g.get(r,2)), a=norm(g.get(r,3));
      if(h&&a) out.push({md,home:h,homeCanon:canon(h),away:a,awayCanon:canon(a),gh:num(g.get(r,4)),ga:num(g.get(r,5))});
    }
  }
  return out;
}

function parseClassifiche(wb){
  const g=sheetToGrid(wb.Sheets[findChampSheet(wb)]);
  const title=norm(g.get(1,1))||''; const sm=title.match(/(\d{4})\s*[\/-]\s*(\d{2})/); const season=sm?(sm[1]+'/'+sm[2]):null;

  const scores={},display={},totals={}; let G=0;

  // --- layout STANDARD: riga con col2==1 && col3==2 ---
  let hdr=null; for(let r=1;r<=25;r++){ if(g.get(r,2)===1&&g.get(r,3)===2){hdr=r;break;} }
  if(hdr){
    let tot=null; for(let c=2;c<=90;c++){ const h=norm(g.get(hdr,c)); if(h&&/^total$/i.test(h)){tot=c;break;} }
    if(!tot) throw new Error('Colonna TOTAL campionato non trovata');
    G=tot-2; let r=hdr+1;
    while(true){ const nm=norm(g.get(r,1)); if(!nm)break;
      const sc=[]; for(let i=0;i<G;i++)sc.push(num(g.get(r,2+i)));
      if(sc.every(x=>x==null))break;
      const cn=canon(nm); scores[cn]=sc; display[cn]=cn; totals[cn]=num(g.get(r,tot)); r++;
    }
  } else {
    // --- layout TRASPOSTO (stagioni molto vecchie): allenatori in riga, giornate come righe ---
    let mgrRow=null;
    for(let r=1;r<=8;r++){ let names=0; for(let c=1;c<=g.maxC;c++){ const v=norm(g.get(r,c)); if(v&&isNaN(+v))names++; }
      if(names>=4){mgrRow=r;break;} }
    if(mgrRow==null) throw new Error('Riga giornate campionato non trovata');
    const mgrs=[]; for(let c=1;c<=g.maxC;c++){ const v=norm(g.get(mgrRow,c));
      if(v&&isNaN(+v)) mgrs.push({col:c,name:v}); else if(mgrs.length) break; }
    if(mgrs.length<2) throw new Error('Riga giornate campionato non trovata');
    mgrs.forEach(m=>{ const cn=canon(m.name); display[cn]=cn; scores[cn]=[]; });
    let totalsRow=null;
    for(let r=mgrRow+1;r<=g.maxR;r++){
      const vals=mgrs.map(m=>num(g.get(r,m.col)));
      if(vals.some(v=>v==null)) continue;
      if(Math.max(...vals)>300){ totalsRow=r; break; }
      mgrs.forEach((m,i)=>scores[canon(m.name)].push(vals[i]));
    }
    G=scores[canon(mgrs[0].name)].length;
    if(totalsRow){ mgrs.forEach(m=>totals[canon(m.name)]=num(g.get(totalsRow,m.col))); }
    else { mgrs.forEach(m=>{ const cn=canon(m.name); totals[cn]=scores[cn].reduce((a,b)=>a+(b||0),0); }); }
  }

  const order=Object.keys(scores).sort((a,b)=>(totals[b]||0)-(totals[a]||0));
  const finalStanding=order.map((k,i)=>({pos:i+1,canon:k,name:display[k],total:totals[k]}));

  // --- classifica Coppa: prima nel foglio campionato, altrimenti nel foglio "Classifica Coppa" ---
  let cupGrid=g, cr=null;
  for(let rr=1;rr<=90;rr++){const v=norm(g.get(rr,1)); if(v&&/^(cup standing|classifica coppa)/i.test(v)){cr=rr;break;}}
  if(cr==null){ const cs=findCupSheet(wb); if(cs){ cupGrid=sheetToGrid(wb.Sheets[cs]);
    for(let rr=1;rr<=90;rr++){const v=norm(cupGrid.get(rr,1)); if(v&&/^(cup standing|classifica coppa)/i.test(v)){cr=rr;break;}} } }
  const cup=[];
  if(cr!=null){
    let chdr=null;
    for(let r=cr+1;r<=cr+6&&!chdr;r++){ for(let c=1;c<=40;c++){ const h=norm(cupGrid.get(r,c)); if(h&&/^(points|punti|pnt|p)$/i.test(h)){chdr=r;break;} } }
    const cmap={}; let nameCol=1;
    if(chdr){ for(let c=1;c<=40;c++){ const lab=norm(cupGrid.get(chdr,c)); if(!lab)continue; const L=lab.toUpperCase();
      if(/^(POINTS|PUNTI|PNT|P)$/.test(L))cmap.points=c;
      else if(/^(GF|GOL FATTI)$/.test(L))cmap.gf=c;
      else if(/^(GS|GOL SUBITI)$/.test(L))cmap.gs=c;
      else if(/^(W|WIN|VITTORIE)$/.test(L))cmap.w=c;
      else if(/^(D|DRAW|PAREGGI)$/.test(L))cmap.d=c;
      else if(/^(L|LOSE|SCONFITTE)$/.test(L))cmap.l=c;
      else if(/^(SQUADRA|TEAM)$/.test(L))nameCol=c;
      else if(L==='DR'||L==='DR ±'||/^DIFF/.test(L))cmap.dr=c;
    } }
    const rv=(rr,key)=>{ const c=cmap[key]; if(!c)return null; let v=cupGrid.get(rr,c); if(v==null)v=cupGrid.get(rr,c+1); return v; };
    let rr=(chdr||cr+2)+1;
    while(rr<=cupGrid.maxR){ const nm=norm(cupGrid.get(rr,nameCol)); let pts=num(rv(rr,'points'));
      if(nm&&pts!=null){
        const drRaw=rv(rr,'dr'); const dr=num(drRaw)!=null?num(drRaw):(drRaw!=null&&drRaw!==''?parseInt(String(drRaw).replace('+',''),10):null);
        cup.push({canon:canon(nm),name:nm,points:pts,gf:num(rv(rr,'gf')),gs:num(rv(rr,'gs')),dr,w:num(rv(rr,'w')),d:num(rv(rr,'d')),l:num(rv(rr,'l'))});
        rr++;
      } else if(cup.length){ break; } else { rr++; }
    }
  }

  // --- Final Four (stesso foglio della classifica Coppa) ---
  let ffr=null; for(let rr=1;rr<=cupGrid.maxR;rr++){const v=norm(cupGrid.get(rr,1)); if(v&&/^(final four|fase finale)/i.test(v)){ffr=rr;break;}}
  const bracket={semifinals:[],champion:null};
  if(ffr!=null){ const sfRows=[],winners=[]; let champ=null,champCol=-1;
    for(let rr=ffr+1;rr<ffr+16;rr++){
      const nm=norm(cupGrid.get(rr,1));
      const nums=[]; for(let c=2;c<=6;c++){const x=num(cupGrid.get(rr,c)); if(x!=null)nums.push(x);}
      if(nm&&nums.length>=1)sfRows.push({name:nm,scores:nums.slice(0,2)});
      const w=norm(cupGrid.get(rr,6)); if(w&&isNaN(+w))winners.push(w);
      for(let c=7;c<40;c++){const v=norm(cupGrid.get(rr,c)); if(v&&/[A-Za-z]/.test(v)&&c>champCol){champ=v;champCol=c;}}
    }
    for(let i=0;i+1<sfRows.length;i+=2)
      bracket.semifinals.push({a:sfRows[i].name,b:sfRows[i+1].name,winner:winners[i/2]||null,scoreA:sfRows[i].scores,scoreB:sfRows[i+1].scores});
    bracket.champion=champ;
  }

  const cupMatches=parseCupMatches(wb);

  // --- stagioni "vecchio stile": Coppa a nomi-squadra -> ricostruisci dal calendario e mappa ---
  const mgrSet=new Set(Object.keys(scores));
  const stdInMgr=cup.filter(c=>mgrSet.has(c.canon)).length;
  if(cup.length && stdInMgr < cup.length/2 && cupMatches.length){
    const tab={};
    cupMatches.forEach(m=>{ if(m.gh==null||m.ga==null)return;
      [[m.homeCanon,m.gh,m.ga],[m.awayCanon,m.ga,m.gh]].forEach(([cn,gf,gs])=>{const t=tab[cn]||(tab[cn]={canon:cn,points:0,gf:0,gs:0,w:0,d:0,l:0});t.gf+=gf;t.gs+=gs;if(gf>gs){t.points+=3;t.w++;}else if(gf===gs){t.points++;t.d++;}else t.l++;});});
    const recon=Object.values(tab).sort((a,b)=>b.points-a.points||(b.gf-b.gs)-(a.gf-a.gs));
    const K=ts=>String(ts.name||ts).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
    const used=new Set(), t2m={};
    cup.forEach(ts=>{const m=recon.find(r=>!used.has(r.canon)&&r.points===ts.points&&r.w===ts.w&&r.d===ts.d&&r.l===ts.l); if(m){t2m[K(ts)]=m.canon;used.add(m.canon);}});
    cup.forEach(ts=>{if(t2m[K(ts)])return; const m=recon.find(r=>!used.has(r.canon)&&r.points===ts.points&&r.gf===ts.gf&&r.gs===ts.gs); if(m){t2m[K(ts)]=m.canon;used.add(m.canon);}});
    const remT=cup.filter(ts=>!t2m[K(ts)]), remM=recon.filter(r=>!used.has(r.canon));
    if(remT.length===1&&remM.length===1){t2m[K(remT[0])]=remM[0].canon;}
    cup.length=0;
    recon.forEach(r=>cup.push({canon:r.canon,name:r.canon,points:r.points,gf:r.gf,gs:r.gs,dr:r.gf-r.gs,w:r.w,d:r.d,l:r.l}));
    const rm=nm=>{ if(nm==null)return nm; return t2m[K(nm)]||nm; };
    if(bracket){ bracket.champion=rm(bracket.champion);
      (bracket.semifinals||[]).forEach(s=>{ s.a=rm(s.a); s.b=rm(s.b); s.winner=rm(s.winner); }); }
  }

  return {season,giornate:G,championship:{finalStanding,scores},cup:{standing:cup,matches:cupMatches,bracket},_display:display};
}

function parseRose(wb){
  const ws=wb.Sheets[findAstaSheet(wb)]; const g=sheetToGrid(ws);
  // colonna ruoli (layout "etichettato", 2018/19 in poi)
  let roleCol=null;
  for(let c=g.maxC;c>=1;c--){ let found=false;
    for(let r=3;r<40;r++){const v=norm(g.get(r,c)); if(v&&ROLES.includes(v.split(' ')[0])){found=true;break;}}
    if(found){roleCol=c;break;}
  }
  // colonna "NOME ALLENATORE" (se presente)
  let labelCol=null; for(let c=1;c<=g.maxC;c++){const v=norm(g.get(1,c)); if(v&&/nome allenatore/i.test(v)){labelCol=c;break;}}
  // allenatori: passo 2 da col1, stop al primo vuoto/etichetta (esclude colonne-nota tipo AGOSTO)
  const managers=[];
  for(let c=1;c<=g.maxC;c+=2){
    if(labelCol&&c>=labelCol) break;
    const nm=norm(g.get(1,c)); if(!nm) break;
    if(/nome allenatore/i.test(nm)) break;
    managers.push({col:c,name:nm,canon:canon(nm),team:norm(g.get(2,c))});
  }
  if(!managers.length) throw new Error('Nessun allenatore trovato nel Foglio Asta');
  if(roleCol){
    // layout ETICHETTATO: ruoli dalla colonna etichette (qualsiasi composizione)
    return managers.map(mg=>{ const players=[];
      for(let r=3;r<40;r++){ const lab=norm(g.get(r,roleCol)); if(!lab)continue;
        const role=lab.split(' ')[0]; if(!ROLES.includes(role))continue;
        const pn=norm(g.get(r,mg.col)); const pr=num(g.get(r,mg.col+1));
        if(pn)players.push({role,player:pn,price:pr});
      }
      return {canon:mg.canon,name:mg.name,team:mg.team,players};
    });
  }
  // layout POSIZIONALE (2017/18 e precedenti): nessuna etichetta, ruoli per posizione
  let startRow=null;
  for(let r=3;r<=g.maxR;r++){ if(norm(g.get(r,managers[0].col))){startRow=r;break;} }
  if(startRow==null) throw new Error('Rose non trovate nel Foglio Asta');
  let count=0;
  for(let r=startRow;r<=g.maxR;r++){ const v=norm(g.get(r,managers[0].col)); if(!v||v.toUpperCase()==='DELTA')break; count++; }
  const comp=ROSTER_TEMPLATES[count];
  if(!comp) throw new Error('Composizione rosa non riconosciuta ('+count+' giocatori). Formati noti: 25 (3-8-8-6) o 28 (3-9-9-7).');
  const roleSeq=[]; ROLES.forEach((role,i)=>{ for(let k=0;k<comp[i];k++)roleSeq.push(role); });
  return managers.map(mg=>{ const players=[];
    for(let i=0;i<count;i++){ const pn=norm(g.get(startRow+i,mg.col)); const pr=num(g.get(startRow+i,mg.col+1));
      if(pn)players.push({role:roleSeq[i],player:pn,price:pr}); }
    return {canon:mg.canon,name:mg.name,team:mg.team,players};
  });
}

function buildSeason(clsWb,roseWb){
  const cls=parseClassifiche(clsWb); const rosters=parseRose(roseWb);
  const teamByCanon={}; rosters.forEach(r=>teamByCanon[r.canon]=r.team);
  const managers=Object.keys(cls.championship.scores).map(k=>({canon:k,name:cls._display[k],team:teamByCanon[k]||null}));
  const season={season:cls.season,giornate:cls.giornate,managers,championship:cls.championship,cup:cls.cup,rosters,importedAt:new Date().toISOString()};
  delete season.championship._display; return season;
}
function analyzeSeason(s){
  const A=[]; A.push([s.season?'ok':'err',`Stagione rilevata: ${s.season||'NON RILEVATA'}`]); A.push(['','']);
  A.push(['','Campionato']);
  A.push([s.managers.length===10?'ok':'warn',`${s.managers.length} partecipanti`]);
  A.push([s.giornate>0?'ok':'err',`${s.giornate} giornate`]);
  A.push([s.championship.finalStanding.length?'ok':'err',`classifica finale ${s.championship.finalStanding.length?'disponibile':'assente'}`]);
  A.push(['','']); A.push(['','Coppa']);
  A.push([s.cup.standing.length?'ok':'warn',`classifica ${s.cup.standing.length?'disponibile':'assente'}`]);
  const mds=[...new Set(s.cup.matches.map(m=>m.md))];
  A.push([s.cup.matches.length?'ok':'warn',`${mds.length} giornate · ${s.cup.matches.length} incontri`]);
  A.push([s.cup.bracket.champion?'ok':'warn',`vincitore Coppa: ${s.cup.bracket.champion||'da confermare'}`]);
  // cross-check reconstruction of cup standings
  if(s.cup.matches.length&&s.cup.standing.length){
    const tab={}; s.cup.matches.forEach(m=>{ if(m.gh==null||m.ga==null)return;
      [[m.homeCanon,m.gh,m.ga],[m.awayCanon,m.ga,m.gh]].forEach(([c,gf,gs])=>{const t=tab[c]||(tab[c]={pts:0,gf:0,gs:0,w:0,d:0,l:0});
        t.gf+=gf;t.gs+=gs; if(gf>gs){t.pts+=3;t.w++;}else if(gf===gs){t.pts++;t.d++;}else t.l++;});});
    let okc=0; s.cup.standing.forEach(c=>{const t=tab[c.canon]; if(t&&t.pts===c.points&&t.gf===c.gf&&t.gs===c.gs&&t.w===c.w&&t.d===c.d&&t.l===c.l)okc++;});
    A.push([okc===s.cup.standing.length?'ok':'warn',`coerenza risultati Coppa: ${okc}/${s.cup.standing.length} squadre verificate`]);
  }
  A.push(['','']); A.push(['','Rose']);
  A.push([s.rosters.length===10?'ok':'warn',`${s.rosters.length} rose`]);
    const KNOWN_COMP=[[3,9,9,7],[3,8,8,6],[3,8,8,7]]; // formati validi (attuale e storici)
  const bad=[]; s.rosters.forEach(r=>{ const c={POR:0,DIF:0,CEN:0,ATT:0}; r.players.forEach(p=>c[p.role]++);
    const okc=KNOWN_COMP.some(t=>c.POR===t[0]&&c.DIF===t[1]&&c.CEN===t[2]&&c.ATT===t[3]);
    if(!okc) bad.push(`${r.name} (${c.POR}-${c.DIF}-${c.CEN}-${c.ATT})`); });
  const anyComp=s.rosters.length?(()=>{const c={POR:0,DIF:0,CEN:0,ATT:0};s.rosters[0].players.forEach(p=>c[p.role]++);return `${c.POR}-${c.DIF}-${c.CEN}-${c.ATT}`;})():'';
  A.push([bad.length?'warn':'ok', bad.length?`composizione non standard: ${bad.join(', ')}`:`composizione ${anyComp} verificata per tutte`]);
    // name coherence vs already-imported seasons
  const known=new Set(); Object.values(state.seasons).forEach(se=>se.managers.forEach(m=>known.add(m.canon)));
  if(known.size){ const newOnes=s.managers.map(m=>m.canon).filter(c=>!known.has(c));
    if(newOnes.length) A.push(['warn',`nomi non presenti nelle stagioni già in archivio: ${newOnes.map(c=>c).join(', ')} (verifica eventuali alias)`]);
    else A.push(['ok','nomi allenatori coerenti con l\'archivio esistente']);
  }
  return A;
}

function computeProgressive(s){
  const cans=s.managers.map(m=>m.canon); const G=s.giornate; const cum={}; cans.forEach(c=>cum[c]=0);
  const prog=[];
  for(let g=0;g<G;g++){
    cans.forEach(c=>{ const v=s.championship.scores[c]?.[g]; cum[c]+=(typeof v==='number'?v:0); });
    const ordered=[...cans].sort((a,b)=>{ if(cum[b]!==cum[a])return cum[b]-cum[a];
      return (s.championship.scores[b]?.[g]||0)-(s.championship.scores[a]?.[g]||0); });
    const map={}; ordered.forEach((c,i)=>map[c]={cum:Math.round(cum[c]*10)/10,pos:i+1}); prog.push(map);
  }
  return prog;
}

  if(chartRef)chartRef.destroy();

      plugins:{legend:{labels:{color:'#e8ecf5'}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y}° pos`}}},
      scales:{y:{reverse:true,min:1,max:s.managers.length,ticks:{stepSize:1,color:'#93a0bd',callback:v=>v+'°'},grid:{color:'#2b3450'},title:{display:true,text:'Posizione',color:'#93a0bd'}},
        x:{ticks:{color:'#93a0bd',maxTicksLimit:19},grid:{color:'rgba(43,52,80,.5)'},title:{display:true,text:'Giornata',color:'#93a0bd'}}}}});
  const mini=document.getElementById('mini'),gLbl=document.getElementById('gLbl'),scrub=document.getElementById('scrub');
  function showAt(gg){ chartRef.data.datasets.forEach((ds,i)=>{ds.data=prog.slice(0,gg).map(m=>m[top3[i]].pos);}); chartRef.update('none');
    gLbl.textContent=gg; scrub.value=gg; const snap=prog[gg-1];
    const ordered=Object.keys(snap).sort((a,b)=>snap[a].pos-snap[b].pos);
    mini.innerHTML=`<div class="tag" style="margin-bottom:6px">Classifica dopo giornata ${gg}</div>`+
      ordered.map(cn=>`<div class="row"><span><b>${snap[cn].pos}.</b> ${nameOf(s,cn)}${top3.includes(cn)?' ⭐':''}</span><span class="hint">${fmt(snap[cn].cum)}</span></div>`).join(''); }
  showAt(s.giornate);
  let playing=false,gg=s.giornate; const play=document.getElementById('play'),restart=document.getElementById('restart'),speed=document.getElementById('speed');
  function stop(){playing=false;play.textContent='▶ Riproduci';clearInterval(animTimer);}
  play.onclick=()=>{ if(playing){stop();return;} if(gg>=s.giornate)gg=0; playing=true;play.textContent='⏸ Pausa';
    animTimer=setInterval(()=>{gg++;showAt(gg);if(gg>=s.giornate)stop();},+speed.value); };
  restart.onclick=()=>{stop();gg=1;showAt(1);}; scrub.oninput=()=>{stop();gg=+scrub.value;showAt(gg);};
}

function renderCoppa(s){
  view.innerHTML=''; const std=s.cup.standing;
  const t=el('div','card',`<h2>Classifica Coppa · ${s.season}</h2><div class="sub">Fase a girone</div>`);
  let rows=''; std.forEach((c,i)=>{ rows+=`<tr><td><span class="${posClass(i+1)}">${i+1}</span></td><td>${c.name}</td><td class="r">${fmt(c.points)}</td><td class="r hint">${fmt(c.w)}-${fmt(c.d)}-${fmt(c.l)}</td><td class="r hint">${fmt(c.gf)}:${fmt(c.gs)}</td><td class="r">${c.dr>0?'+':''}${fmt(c.dr)}</td></tr>`; });
  t.innerHTML+=`<table><thead><tr><th>Pos</th><th>Allenatore</th><th class="r">Pt</th><th class="r">V-N-P</th><th class="r">GF:GS</th><th class="r">DR</th></tr></thead><tbody>${rows}</tbody></table>`;
  const br=s.cup.bracket; const bc=el('div','card',`<h2>Final Four</h2><div class="sub">Semifinali e finale</div>`);
  if(br.semifinals.length){ const sf=br.semifinals;
    bc.innerHTML+=`<div class="bracket"><div>${sf.map(m=>`<div>
        <div class="bx ${canon(m.winner)===canon(m.a)?'win':''}">${m.a} ${canon(m.winner)===canon(m.a)?'<span class="badge win">Q</span>':''}</div>
        <div class="bx ${canon(m.winner)===canon(m.b)?'win':''}">${m.b} ${canon(m.winner)===canon(m.b)?'<span class="badge win">Q</span>':''}</div></div>`).join('')}</div>
      <div style="text-align:center"><div class="trophy">🏆</div><div class="tag">Campione</div><div class="badge gold" style="margin-top:6px">${br.champion||'–'}</div></div>
      <div><div class="bx win" style="text-align:right">${br.champion||'–'}</div>
        <div class="bx" style="text-align:right">${sf.map(m=>m.winner).filter(w=>canon(w)!==canon(br.champion))[0]||'–'}</div>
        <small class="tag">Finale</small></div></div>`;
  } else bc.innerHTML+=`<p class="hint">Tabellone non disponibile per questa stagione.</p>`;
  const h2h=el('div','card',`<h2>Scontri diretti Coppa</h2><div class="sub">Storico testa a testa su tutte le stagioni importate.</div>`);
  const opts=s.managers.map(m=>`<option value="${m.canon}">${m.name}</option>`).join('');
  h2h.innerHTML+=`<div class="h2h-controls"><select id="h2a" class="sel">${opts}</select><span class="hint">vs</span>
     <select id="h2b" class="sel">${opts}</select>
     <select id="h2scope" class="sel" style="min-width:auto"><option value="all">Tutte le stagioni</option>${Object.keys(state.seasons).map(k=>`<option value="${k}">${state.seasons[k].season}</option>`).join('')}</select>
   </div><div id="h2res" style="margin-top:14px"></div>`;
  view.append(t,bc,h2h);
  const a=document.getElementById('h2a'),b=document.getElementById('h2b'),scope=document.getElementById('h2scope'),res=document.getElementById('h2res');
  if(s.managers[1])b.value=s.managers[1].canon;
  function compute(){ const ca=a.value,cb=b.value; const o={g:0,w:0,d:0,l:0,gf:0,gs:0,list:[]};
    const seasons=scope.value==='all'?Object.values(state.seasons):[state.seasons[scope.value]];
    seasons.forEach(se=>{(se.cup.matches||[]).forEach(m=>{ let gf,gs;
      if(m.homeCanon===ca&&m.awayCanon===cb){gf=m.gh;gs=m.ga;} else if(m.homeCanon===cb&&m.awayCanon===ca){gf=m.ga;gs=m.gh;} else return;
      if(gf==null||gs==null)return; o.g++;o.gf+=gf;o.gs+=gs; if(gf>gs)o.w++;else if(gf===gs)o.d++;else o.l++;
      o.list.push({season:se.season,md:m.md,home:m.home,away:m.away,gh:m.gh,ga:m.ga});});});
    o.list.sort((x,y)=>x.season.localeCompare(y.season)||((x.md||0)-(y.md||0))); return o; }
  function draw(){ if(a.value===b.value){res.innerHTML='<p class="hint">Seleziona due allenatori diversi.</p>';return;}
    const o=compute(); const na=nameOf(s,a.value),nb=nameOf(s,b.value);
    res.innerHTML=`<div class="grid g4">
      <div class="kpi"><div class="l">Giocate</div><div class="v">${o.g}</div></div>
      <div class="kpi"><div class="l">Vittorie ${na}</div><div class="v" style="color:var(--green)">${o.w}</div></div>
      <div class="kpi"><div class="l">Pareggi</div><div class="v">${o.d}</div></div>
      <div class="kpi"><div class="l">Vittorie ${nb}</div><div class="v" style="color:var(--red)">${o.l}</div></div></div>
     <p class="hint" style="margin-top:8px">Gol: ${na} ${o.gf} – ${o.gs} ${nb}</p>`+
     (o.list.length?`<table style="margin-top:6px"><thead><tr><th>Stagione</th><th class="r">G</th><th>Casa</th><th class="r">Ris.</th><th>Trasferta</th></tr></thead><tbody>${o.list.map(x=>`<tr><td>${x.season}</td><td class="r">${x.md??''}</td><td>${x.home}</td><td class="r"><b>${fmt(x.gh)}-${fmt(x.ga)}</b></td><td>${x.away}</td></tr>`).join('')}</tbody></table>`:'<p class="hint">Nessun incontro trovato tra i due nella selezione.</p>'); }
  [a,b,scope].forEach(x=>x.onchange=draw); draw();
}

function renderRose(s){
  view.innerHTML='';
  const head=el('div','card',`<h2>Rose iniziali · ${s.season}</h2><div class="sub">Formazioni all'asta. Nessuna ricerca per giocatore (nomi non uniformi tra stagioni).</div>`);
  const opts=`<option value="__all">Tutte le rose</option>`+s.rosters.map(r=>`<option value="${r.canon}">${r.name} — ${r.team||''}</option>`).join('');
  head.innerHTML+=`<div class="h2h-controls"><select id="rSel" class="sel" style="min-width:260px">${opts}</select></div>`;
  const allp=[]; s.rosters.forEach(r=>r.players.forEach(p=>allp.push({...p,manager:r.name,team:r.team})));
  const cur=el('div','card',`<h2>💰 Curiosità · Top 3 acquisti per ruolo</h2><div class="sub">Prezzi d'asta più alti nella stagione ${s.season}</div>`);
  const cg=el('div','grid g4');
  ROLES.forEach(role=>{ const top=allp.filter(p=>p.role===role&&typeof p.price==='number').sort((a,b)=>b.price-a.price).slice(0,3);
    const box=el('div','kpi'); box.innerHTML=`<div class="l">${ROLE_LABEL[role]}</div>`+top.map((p,i)=>`<div class="pl"><span>${['🥇','🥈','🥉'][i]} ${p.player} <span class="hint">· ${p.manager}</span></span><span class="pr">${fmt(p.price)}</span></div>`).join(''); cg.append(box); });
  cur.append(cg);
  const grid=el('div','grid g3'); grid.id='rosterGrid'; view.append(head,cur,grid);
  function card(r){ const byRole={POR:[],DIF:[],CEN:[],ATT:[]}; r.players.forEach(p=>byRole[p.role].push(p));
    const spent=r.players.reduce((a,p)=>a+(p.price||0),0); const c=el('div','roster');
    let h=`<h3>${r.name}</h3><div class="team">${r.team||''}</div>`;
    ROLES.forEach(role=>{ h+=`<div class="rolehdr">${ROLE_LABEL[role]}</div>`+byRole[role].map(p=>`<div class="pl"><span>${p.player}</span><span class="pr">${fmt(p.price)}</span></div>`).join(''); });
    h+=`<div class="foot"><span>Spesa totale</span><b style="color:var(--gold2)">${fmt(spent)}</b></div>`; c.innerHTML=h; return c; }
  function draw(){ const g=document.getElementById('rosterGrid'); g.innerHTML=''; const sel=document.getElementById('rSel').value;
    const list=sel==='__all'?s.rosters:s.rosters.filter(r=>r.canon===sel); g.className=sel==='__all'?'grid g3':'grid g2'; list.forEach(r=>g.append(card(r))); }
  document.getElementById('rSel').onchange=draw; draw();
}

/* ---------- WIRING ---------- */
function refreshSeasonSelect(){ const sel=document.getElementById('seasonSelect');
  const keys=Object.keys(state.seasons).sort((a,b)=>b.localeCompare(a));
  sel.innerHTML=keys.map(k=>`<option value="${k}">${state.seasons[k].season}</option>`).join('');
  if(state.current&&state.seasons[state.current])sel.value=state.current; else state.current=keys[0]||null; }
function setTab(t){ state.tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t)); if(animTimer)clearInterval(animTimer); render(); }
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t)setTab(t.dataset.t);});
document.getElementById('seasonSelect').addEventListener('change',e=>{state.current=e.target.value; render();});

const overlay=document.getElementById('overlay');
const openModal=()=>overlay.classList.add('show');
function closeModal(){ overlay.classList.remove('show'); state.pendingImport=null;
  document.getElementById('previewWrap').style.display='none'; document.getElementById('mConfirm').disabled=true;
  ['fileClass','fileRose'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('nameClass').textContent=''; document.getElementById('nameRose').textContent=''; }
document.getElementById('btnImport').onclick=openModal;
document.getElementById('mClose').onclick=closeModal; document.getElementById('mCancel').onclick=closeModal;
document.getElementById('fileClass').onchange=e=>document.getElementById('nameClass').textContent=e.target.files[0]?.name||'';
document.getElementById('fileRose').onchange=e=>document.getElementById('nameRose').textContent=e.target.files[0]?.name||'';
document.getElementById('btnAnalyze').onclick=async()=>{
  const f1=document.getElementById('fileClass').files[0], f2=document.getElementById('fileRose').files[0];
  const pv=document.getElementById('preview'),wrap=document.getElementById('previewWrap'); wrap.style.display='block'; pv.innerHTML='Lettura file in corso…';
  if(!f1||!f2){pv.innerHTML='<span class="err">Seleziona entrambi i file.</span>';return;}
  try{ const [w1,w2]=await Promise.all([readWorkbook(f1),readWorkbook(f2)]); const s=buildSeason(w1,w2); state.pendingImport=s;
    const rows=analyzeSeason(s); const dup=Object.keys(state.seasons).includes((s.season||'').replace('/','-'));
    pv.innerHTML=rows.map(([lv,tx])=>{ if(tx==='')return '<div style="height:6px"></div>';
      if(lv==='')return `<div style="font-weight:700;margin-top:2px">${tx}</div>`;
      const ic={ok:'✓',warn:'⚠',err:'✗'}[lv]||''; return `<div class="${lv}">${ic} ${tx}</div>`; }).join('')+
      (dup?`<div class="warn" style="margin-top:8px">⚠ La stagione ${s.season} è già in archivio: verrà sostituita.</div>`:'');
    document.getElementById('mConfirm').disabled=!(s.season&&s.giornate);
  }catch(err){ pv.innerHTML=`<span class="err">Errore nel parsing: ${err.message}</span>`; console.error(err); }
};
document.getElementById('mConfirm').onclick=async()=>{ const s=state.pendingImport; if(!s)return;
  const key=(s.season||'stagione').replace('/','-'); try{await DB.put({key,season:s.season,data:s});}catch(e){}
  state.seasons[key]=s; state.current=key; refreshSeasonSelect(); closeModal(); setTab('riepilogo'); };
document.getElementById('btnExport').onclick=()=>{ const s=state.seasons[state.current]; if(!s)return;
  const blob=new Blob([JSON.stringify(s,null,0)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(s.season||'stagione').replace('/','-')+'.json'; a.click(); };
document.getElementById('btnManage').onclick=async()=>{ const keys=Object.keys(state.seasons);
  if(!keys.length){alert('Archivio vuoto.');return;}
  const k=prompt('Stagioni in archivio:\n'+keys.map(x=>state.seasons[x].season).join(', ')+'\n\nScrivi la stagione da ELIMINARE (es. 2024/25) oppure lascia vuoto per annullare:');
  if(!k)return; const key=k.replace('/','-');
  if(state.seasons[key]){ try{await DB.del(key);}catch(e){} delete state.seasons[key];
    if(state.current===key)state.current=Object.keys(state.seasons)[0]||null; refreshSeasonSelect(); render(); } else alert('Stagione non trovata.'); };

async function boot(){
  try{ (typeof EMBEDDED_SEASONS!=='undefined'?EMBEDDED_SEASONS:[]).forEach(d=>{ if(d&&d.season)state.seasons[d.season.replace('/','-')]=d; }); }catch(e){}
  try{ const idx=await fetch('season-data/index.json',{cache:'no-store'});
    if(idx.ok){ const {seasons}=await idx.json();
      for(const it of seasons){ const r=await fetch(`season-data/${it.key}.json`,{cache:'no-store'});
        if(r.ok){ const data=await r.json(); state.seasons[data.season.replace('/','-')]=data; } } }
  }catch(e){}
  try{ const rows=await DB.all(); rows.forEach(r=>state.seasons[r.key]=r.data); }catch(e){}
  refreshSeasonSelect(); setTab('riepilogo');
}
boot();
</script>
